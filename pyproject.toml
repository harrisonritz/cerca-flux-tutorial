[project]
name = "cerca-flux-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dipy>=1.9.0",
    "h5io>=0.2.4",
    "joblib>=1.4.0",
    "jupyter>=1.1.1",
    "mne>=1.13.2",
    "mne-bids>=0.19.0",
    "mne-qt-browser>=0.7.5",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyqt5>=5.15.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cerca-flux = "cerca_flux.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerca_flux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
